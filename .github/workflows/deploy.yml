name: 4H deploy

# Started by hand from the Actions tab, on main only (the Azure federated credential pins the main branch).
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group to deploy into (must already exist)
        required: true
        default: rg-td4-canada
      owner_tag:
        description: Value of the required owner tag
        required: true
        default: eojin

# id-token: write lets this job ask GitHub for the short-lived OIDC token. Nothing else is allowed.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Log in to Azure (OIDC, no stored password)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the storage account (prints only the final state)
        env:
          # Inputs go through environment variables so they are never pasted into the shell script text.
          RG: ${{ inputs.resource_group }}
          OWNER_TAG: ${{ inputs.owner_tag }}
        run: |
          set +e
          out=$(az deployment group create \
            --resource-group "$RG" \
            --template-file 4h-secretless-deploy/main.bicep \
            --parameters owner="$OWNER_TAG" \
            --query properties.provisioningState -o tsv 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # Public logs: print error codes only, never the full error text (it can hold object IDs).
            echo "FAIL: deployment did not succeed. Error codes: $(printf '%s' "$out" | grep -o '([A-Za-z]*)' | sort -u | tr '\n' ' ')"
            exit 1
          fi
          printf '%s\n' "$out" | tail -n 1
